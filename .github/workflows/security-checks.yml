name: Pane security checks

on:
  push:
    branches:
      - "security/**"
  pull_request:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Python security tests
        run: python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
