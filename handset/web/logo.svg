<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pane">
  <defs>
    <linearGradient id="pane-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="0.55" stop-color="#0a6cff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="pane-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9e8ff" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="pane-screen">
      <rect x="20" y="13" width="20" height="38" rx="4.5"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#pane-bg)"/>
  <rect width="64" height="32" rx="15" fill="#ffffff" opacity="0.08"/>

  <!-- phone body -->
  <rect x="17" y="10" width="26" height="44" rx="7.5" fill="url(#pane-glass)"/>
  <!-- screen -->
  <rect x="20" y="13" width="20" height="38" rx="4.5" fill="#0b1630"/>
  <!-- glass reflection across the screen -->
  <g clip-path="url(#pane-screen)">
    <path d="M14 40 L38 8 L46 8 L22 40 Z" fill="#ffffff" opacity="0.22"/>
    <path d="M18 52 L44 18 L47 18 L21 52 Z" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- notch -->
  <rect x="26.5" y="13" width="7" height="2.6" rx="1.3" fill="url(#pane-glass)"/>

  <!-- streaming waves -->
  <path d="M47.5 26.5 a8 8 0 0 1 0 11" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M51.5 22.5 a14 14 0 0 1 0 19" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
</svg>
